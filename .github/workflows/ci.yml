name: CI for Static Portfolio Project

on:
  pull_request:
    branches: [ master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install HTML Tidy
      run: sudo apt-get install -y tidy

    - name: Validate HTML
      run: |
        tidy -errors -quiet index.html || true
